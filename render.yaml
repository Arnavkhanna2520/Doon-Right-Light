# Render blueprint: one Docker web service + managed PostgreSQL.
# Create with: Render dashboard > New > Blueprint > pick this repository.
services:
  - type: web
    name: doon-right-light
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DRL_ENV
        value: production
      - key: DRL_SECRET_KEY
        generateValue: true
      - key: DRL_TRUST_PROXY
        value: "true"
      - key: DRL_DATABASE_URL
        fromDatabase:
          name: doon-right-light-db
          property: connectionString
      - key: DRL_ADMIN_EMAIL
        sync: false
      - key: DRL_ADMIN_PASSWORD
        sync: false
databases:
  - name: doon-right-light-db
    plan: free
